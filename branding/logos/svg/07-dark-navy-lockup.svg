<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-labelledby="title desc">
  <title id="title">B2B Sales Leads  Dark Navy Lockup</title>
  <desc id="desc">High-contrast white and ice-blue lockup on deep navy for dark surfaces.</desc>
  <rect width="480" height="420" fill="#071018"/>
  <defs>
    <linearGradient id="darkGrowth" x1="40" y1="200" x2="420" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9D9F2"/>
      <stop offset="55%" stop-color="#5B8DEF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <path fill="none" stroke="url(#darkGrowth)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"
        d="M48 210 L110 150 L160 190 L230 100 L300 145 L360 70"/>
  <path fill="#FFFFFF" d="M348 42 L420 55 L370 115 Z"/>
  <text x="240" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="3" fill="#FFFFFF">B2B SALES LEADS</text>
  <text x="240" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" letter-spacing="4" fill="#C9D9F2">THE POWER OF EXPERIENCE</text>
</svg>
