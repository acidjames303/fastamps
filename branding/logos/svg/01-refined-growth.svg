<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-labelledby="title desc">
  <title id="title">B2B Sales Leads  Refined Growth</title>
  <desc id="desc">Simplified upward growth line ending in an arrow, with brand name and tagline.</desc>
  <defs>
    <linearGradient id="growthGrad" x1="40" y1="200" x2="420" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8EB6F5"/>
      <stop offset="55%" stop-color="#3D6B9A"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
  </defs>
  <!-- Mark -->
  <path fill="none" stroke="url(#growthGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"
        d="M48 210 L110 150 L160 190 L230 100 L300 145 L360 70"/>
  <path fill="#0A1628" d="M348 42 L420 55 L370 115 Z"/>
  <!-- Wordmark -->
  <text x="240" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="3" fill="#0A1628">B2B SALES LEADS</text>
  <text x="240" y="325" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" letter-spacing="4" fill="#3D6B9A">THE VOICE OF EXPERIENCE</text>
</svg>
