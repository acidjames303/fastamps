<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">B2B Sales Leads  Horizontal Growth (Dark)</title>
  <desc id="desc">Preferred site lockup: growth mark beside wordmark and Voice of Experience tagline on dark ground.</desc>
  <rect width="720" height="220" fill="#0B0F14"/>
  <defs>
    <linearGradient id="gDark" x1="36" y1="160" x2="180" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9D9F2"/>
      <stop offset="50%" stop-color="#5B8DEF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <!-- Simplified triple growth paths -->
  <g fill="none" stroke="url(#gDark)" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="5" d="M42 158 L72 128 L96 142 L128 98 L152 112 L178 62"/>
    <path stroke-width="5" d="M42 170 L72 140 L96 154 L128 110 L152 124 L170 88"/>
    <path stroke-width="5" d="M42 182 L72 152 L96 166 L128 122 L152 136 L162 112"/>
  </g>
  <path fill="#1E3A8A" d="M168 42 L206 52 L178 84 Z"/>
  <!-- Type -->
  <text x="240" y="108" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" letter-spacing="2.5" fill="#FFFFFF">B2B SALES LEADS</text>
  <text x="240" y="138" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="3.5" fill="#A8B0BC">THE VOICE OF EXPERIENCE</text>
</svg>
