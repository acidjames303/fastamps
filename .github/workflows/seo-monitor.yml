name: SEO Monitor

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SEO monitor
        id: monitor
        continue-on-error: true
        run: |
          mkdir -p reports
          python3 scripts/seo_monitor.py --json reports/latest.json --md reports/latest.md
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: reports/
      - name: Summary
        run: |
          echo "## SmartFunction SEO monitor" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report generated" >> "$GITHUB_STEP_SUMMARY"
          fi
